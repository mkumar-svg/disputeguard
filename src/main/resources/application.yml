server:
  port: ${PORT:8080}

spring:
  application:
    name: disputeguard
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/disputeguard}
    username: ${DATABASE_USERNAME:disputeguard}
    password: ${DATABASE_PASSWORD:disputeguard}
  jpa:
    hibernate:
      ddl-auto: none   # Flyway owns the schema (src/main/resources/db/migration)
    open-in-view: false
  flyway:
    enabled: true
  data:
    redis:
      url: ${REDIS_URL:redis://localhost:6379}
      repositories:
        enabled: false   # Redis is only a cache here; JPA owns the repositories
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      group-id: disputeguard
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

paypal:
  base-url: ${PAYPAL_BASE_URL:https://api-m.sandbox.paypal.com}
  client-id: ${PAYPAL_CLIENT_ID:}
  client-secret: ${PAYPAL_CLIENT_SECRET:}
  webhook-id: ${PAYPAL_WEBHOOK_ID:}
  # Events sent by PayPal's webhook simulator cannot be signature-verified.
  # Set to true ONLY for local testing with the simulator; keep false for real sandbox events.
  skip-webhook-verification: ${PAYPAL_SKIP_WEBHOOK_VERIFICATION:false}

disputeguard:
  events:
    # kafka: webhooks go through Kafka (local setup). inline: processed in-process, for hosts without Kafka.
    mode: ${EVENTS_MODE:kafka}
  topics:
    dispute-created: dispute.created
    dispute-updated: dispute.updated
  store:
    # Where PayPal sends the buyer after approving a demo-store order.
    return-url: ${STORE_RETURN_URL:https://example.com/disputeguard/return}
    cancel-url: ${STORE_CANCEL_URL:https://example.com/disputeguard/cancel}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Any OpenAI-compatible chat-completions endpoint with tool calling.
#   Claude: LLM_BASE_URL=https://api.anthropic.com/v1                         LLM_MODEL=claude-sonnet-5-5
#   Gemini: LLM_BASE_URL=https://generativelanguage.googleapis.com/v1beta/openai LLM_MODEL=gemini-3.8-flash
# With no LLM_API_KEY the agent is skipped and a rule-based evidence pack is produced instead.
llm:
  base-url: ${LLM_BASE_URL:https://api.anthropic.com/v1}
  api-key: ${LLM_API_KEY:}
  model: ${LLM_MODEL:claude-sonnet-5-5}
  fallback-model: ${LLM_FALLBACK_MODEL:}
  max-tokens: ${LLM_MAX_TOKENS:8000}
  max-steps: ${LLM_MAX_STEPS:6}
  timeout-seconds: ${LLM_TIMEOUT_SECONDS:90}

management:
  endpoints:
    web:
      exposure:
        include: health,info
